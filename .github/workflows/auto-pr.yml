name: Auto Create Pull Request

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request to main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create Pull Request if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Verificando se já existe um PR aberto para a branch '$BRANCH_NAME' em direção à 'main'..."
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Um Pull Request já está aberto (#$EXISTING_PR) para a branch '$BRANCH_NAME'."
            exit 0
          fi
          echo "Nenhum PR aberto encontrado. Criando novo Pull Request..."
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "feat: merge \`$BRANCH_NAME\` into \`main\`" \
            --body "### Pull Request Automático

          Este Pull Request foi gerado automaticamente a partir de um push na branch \`$BRANCH_NAME\`.

          - **Branch de origem:** \`$BRANCH_NAME\`
          - **Branch de destino:** \`main\`
          - **Autor:** @${{ github.actor }}